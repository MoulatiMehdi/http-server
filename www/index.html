<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Index</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito&family=Roboto&display=swap" rel="stylesheet">

<style>
body {
    font-family: "Nunito", sans-serif;
    margin: 40px;
    background: #0f172a;
    color: #e5e7eb;
}

h1 {
    font-family: "Roboto", sans-serif;
    margin-bottom: 20px;
}

a {
    color: #38bdf8;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.container {
    max-width: 800px;
}

.file {
    margin: 10px 0;
    padding-left: 10px;
}

.dir::before {
    content: "📁 ";
}

.file::before {
    content: "📄 ";
}
</style>
</head>

<body>
<div class="container">
    <h1>Index of /</h1>

    <div class="file dir">
        <a href="/about.html">about.html</a>
    </div>

    <div class="file">
        <a href="/nonexistent">broken link (404 test)</a>
    </div>

    <div class="file">
        <a href="/forbidden">forbidden test (403)</a>
    </div>
</div>
</body>
</html>
