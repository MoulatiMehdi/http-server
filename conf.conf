server {
    listen 0.0.0.0:8080;
    server_name example.com www.example.com;

    root /home/ihajji/github/http-server/;
    index index.html;

    client_max_body_size 10m;

    error_page 400 /home/ihajji/github/http-server/www/err/400.html;
    error_page 500 /errors/500.html;

    location / {
        allowed_methods GET POST DELETE;
		autoindex on;
		index index.html;
    }

    location /images {
        allowed_methods GET;
        root /var/www/images;
        autoindex off;
    }

    location /upload {
        allowed_methods POST;
        upload_dir /tmp/uploads;
        client_max_body_size 3g;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        root /var/www/cgi-bin;
        cgi .py /usr/bin/python3;
    }

    location /old-page {
        allowed_methods GET;
        return 301 http://example.com/new-page;
    }
}
server {
    listen 127.1.1.1:8181;
    server_name example.com www.example.com;

    root /var/www/html;
    index index.html index2.html;

    client_max_body_size 1000000;

    location /upload {
        allowed_methods POST;
        upload_dir /tmp/uploads;
        client_max_body_size 3g;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        root /var/www/cgi-bin;
        cgi .php /usr/bin/xx;
    }

    location /old-page {
        allowed_methods GET;
        return 301 http://example.com/new-page;
    }
}

