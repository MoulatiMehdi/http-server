server {
    listen 0.0.0.0:8080;

    root test/html/;
    
     location / 
     {
         root test/html/;
         allowed_methods GET DELETE;
         autoindex on;
        # cgi 
     }
     location /post_body 
     {
         allowed_methods POST;
         client_max_body_size 100;
         root test/html/YoupiBanane/;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }
     location /directory/ 
     {
         allowed_methods GET POST;
         root test/html/YoupiBanane/;
         autoindex on;
         client_max_body_size 100g;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }

}
