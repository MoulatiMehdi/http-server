server {
    listen 0.0.0.0:8080;

    root test/;
    
     location / 
     {
         allowed_methods GET;
         index youpi.bad_extension;
         root test/YoupiBanane/;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }
     location /post_body 
     {
         allowed_methods POST;
         client_max_body_size 100;
         root test/YoupiBanane/;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }
     location /directory/ 
     {
         allowed_methods GET POST;
         root test/YoupiBanane/;
         index youpi.bad_extension;
         client_max_body_size 100m;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }
}
