server {
    listen 0.0.0.0:8080;

    root test/;
    
     location / 
     {
         allowed_methods GET DELETE;
         index index.html;
         root test/;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }
     location /post_body 
     {
         allowed_methods POST;
         client_max_body_size 100;
         root test/YoupiBanane/;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }
     location /directory/ 
     {
         allowed_methods GET POST DELETE;
         root test/YoupiBanane/;
         autoindex on;
         client_max_body_size 100g;
        # cgi 
         cgi .bla /goinfre/cgi_tester;  
     }

}
