server {
	listen 8080;

	root /home/ihajji/github/http-server/www/;
	index index.html;
	client_max_body_size 1000;

	error_page 400 /errors/400.html/;
	error_page 403 /errors/403.html/;
	error_page 404 /errors/404.html/;
	error_page 405 /errors/405.html/;
	error_page 500 /errors/500.html/;

# basic static serving + DELETE
	location / {
		allowed_methods GET DELETE;
	}

# POST only — tests method restriction
	location /post-only/ {
		allowed_methods POST;
	}

# directory listing enabled
	location /listing/ {
		allowed_methods GET;
		autoindex on;
		root /home/ihajji/github/http-server/www/listing/;
	}

	location /no-listing/ {
		allowed_methods GET;
		autoindex off;
		root /home/ihajji/github/http-server/www/no-listing/;
	}

# file upload
	location /upload/ {
		allowed_methods POST DELETE;
		upload_dir /home/ihajji/github/http-server/www/upload/;
	}

	location /post-only/ {
		allowed_methods POST ;
	}

	location /old/ {
		allowed_methods GET;
		return 301 /;
	}

# CGI
	location /cgi-bin/ {
		allowed_methods GET POST;
		root /home/ihajji/github/http-server/www/cgi-bin/;
		cgi .py /usr/bin/python3;
	}
}
